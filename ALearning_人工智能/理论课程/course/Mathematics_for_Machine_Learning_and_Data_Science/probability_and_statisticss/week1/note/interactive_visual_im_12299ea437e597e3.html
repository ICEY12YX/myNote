(function() {

  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];

    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],

    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;

      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {

          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });

          }

          this['__lumiLast' + p] = n;

/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */

  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);

(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

  <script>
    // Acklam's inverse normal CDF algorithm for high precision
    function normInv(p) {
      if (p <= 0) return -3.8;
      if (p >= 1) return 3.8;
      const a = [-3.969683028665376e+01,  2.209460984245205e+02, -2.759285104469687e+02,  1.383577518672690e+02, -3.066479806614716e+01,  2.506628277459239e+00];
      const b = [-5.447609879822406e+01,  1.615858368580409e+02, -1.556989798598866e+02,  6.680131188771972e+01, -1.328068155288572e+01];
      const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00,  4.374664141464968e+00,  2.938163982698783e+00];
      const d = [ 7.784695709041462e-03,  3.224671290700398e-01,  2.445134137142996e+00,  3.754408661907416e+00];
      
      const p_low = 0.02425;
      const p_high = 1 - p_low;
      let q, r;
      
      if (p < p_low) {
        q = Math.sqrt(-2 * Math.log(p));
        return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
      }
      if (p <= p_high) {
        q = p - 0.5;
        r = q * q;
        return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
      }
      q = Math.sqrt(-2 * Math.log(1 - p));
      return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }

    function normCdf(x) {
      const t = 1 / (1 + 0.2316419 * Math.abs(x));
      const d = 0.3989422804014327 * Math.exp(-x * x / 2);
      const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
      return x >= 0 ? 1 - p : p;
    }

    function normPdf(x) {
      return (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x);
    }

    function getCssVar(name) {
      if (!name) return '';
      const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim();
    }

    function showErrorFallback(containerId, error) {
      console.error(`Render error in ${containerId}:`, error);
      const container = document.getElementById(containerId);
      if (container) {
        const reason = String((error && error.message) || error || 'unknown').replaceAll('"', "'").slice(0, 160);
        if (container) container.innerHTML = `
          <div style="padding: var(--spacing-l, 16px); background: var(--surface-dim); border-radius: var(--r-m, 12px); text-align: center; color: var(--on-surface-variant);">
            <p style="margin: 0;" class="lumi-body-m">可视化组件渲染异常</p>
            <p style="margin: 4px 0 0 0;" class="lumi-body-s">${reason}</p>
          </div>`;
      }
    }

    // State management
    const state = {
      u: 0.75,
      showBands: false,
      samples: [],
      animProgress: 1.0,
      animStartTime: 0
    };

    // Generate initial N=200 samples
    function generateSamples(n = 200) {
      const arr = [];
      for (let i = 0; i < n; i++) {
        const uVal = Math.random() * 0.98 + 0.01;
        arr.push({ u: uVal, x: normInv(uVal) });
      }
      state.samples = arr;
      state.animProgress = 0.0;
      state.animStartTime = performance.now();
    }

    let canvas, ctx, animationFrameId;

    function renderCanvas() {
      if (!canvas) return;
      const box = canvas.parentElement;
      const w = box.clientWidth || 600;
      const h = box.clientHeight || 380;
      const dpr = window.devicePixelRatio || 1;

      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // Animation tick
      if (state.animProgress < 1.0) {
        const elapsed = performance.now() - state.animStartTime;
        state.animProgress = Math.min(1.0, elapsed / 600); // 600ms duration
      }

      // Dynamic theme colors
      const colorChart1 = getCssVar('--chart-1') || '#2575fc';
      const colorChart3 = getCssVar('--chart-3') || '#228a49';
      const colorPrimary = getCssVar('--primary') || '#3186ff';
      const colorOnSurface = getCssVar('--on-surface') || '#000000';
      const colorOnSurfaceVar = getCssVar('--on-surface-variant') || 'rgba(0,0,0,0.55)';
      const colorOutline = getCssVar('--stroke-default') || '#e3e3e3';
      const colorSurfaceDim = getCssVar('--surface-dim') || '#f2f0f0';
      const colorAccentContainer = getCssVar('--accent-container') || '#dcf1ff';

      // Layout coordinates
      const margin = { top: 20, right: 30, bottom: 25, left: 45 };
      const totalWidth = w - margin.left - margin.right;
      const topHeight = Math.floor((h - margin.top - margin.bottom) * 0.52);
      const gapHeight = 20;
      const bottomHeight = h - margin.top - margin.bottom - topHeight - gapHeight;

      const xMin = -3.5, xMax = 3.5;
      
      const mapX = (x) => margin.left + ((x - xMin) / (xMax - xMin)) * totalWidth;
      const mapTopY = (u) => margin.top + (1 - u) * topHeight;
      const mapBottomY = (pdfVal) => margin.top + topHeight + gapHeight + (1 - pdfVal / 0.45) * bottomHeight;

      // 1. Draw 10% quantile bands if toggled
      if (state.showBands) {
        for (let i = 0; i < 10; i++) {
          const u1 = i * 0.1;
          const u2 = (i + 1) * 0.1;
          const x1 = normInv(Math.max(0.001, u1));
          const x2 = normInv(Math.min(0.999, u2));

          const py1 = mapTopY(u2);
          const py2 = mapTopY(u1);
          const px1 = mapX(x1);
          const px2 = mapX(x2);

          // Top panel horizontal strip
          ctx.fillStyle = (i % 2 === 0) ? 'rgba(49, 134, 255, 0.08)' : 'rgba(49, 134, 255, 0.15)';
          ctx.fillRect(margin.left, py1, totalWidth, py2 - py1);

          // Projected vertical strip down through top and bottom
          ctx.fillStyle = (i % 2 === 0) ? 'rgba(49, 134, 255, 0.04)' : 'rgba(49, 134, 255, 0.10)';
          ctx.fillRect(px1, margin.top, px2 - px1, topHeight + gapHeight + bottomHeight);

          // Quantile divider lines on Y axis
          ctx.strokeStyle = colorOutline;
          ctx.setLineDash([2, 2]);
          ctx.beginPath();
          ctx.moveTo(margin.left, py1);
          ctx.lineTo(margin.left + totalWidth, py1);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // 2. Axes & Grid Lines
      ctx.strokeStyle = colorOutline;
      ctx.lineWidth = 1;

      // Top Y-Axis (Uniform u)
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top);
      ctx.lineTo(margin.left, margin.top + topHeight);
      ctx.stroke();

      // Top Axis baseline
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top + topHeight);
      ctx.lineTo(margin.left + totalWidth, margin.top + topHeight);
      ctx.stroke();

      // Bottom Y-Axis (PDF density)
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top + topHeight + gapHeight);
      ctx.lineTo(margin.left, margin.top + topHeight + gapHeight + bottomHeight);
      ctx.stroke();

      // Bottom X-Axis baseline
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top + topHeight + gapHeight + bottomHeight);
      ctx.lineTo(margin.left + totalWidth, margin.top + topHeight + gapHeight + bottomHeight);
      ctx.stroke();

      // X-Axis Ticks & Labels (-3, -2, -1, 0, 1, 2, 3)
      ctx.fillStyle = colorOnSurfaceVar;
      ctx.font = "11px 'Google Sans Code', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let xVal = -3; xVal <= 3; xVal += 1) {
        const px = mapX(xVal);
        const pyBottom = margin.top + topHeight + gapHeight + bottomHeight;
        ctx.beginPath();
        ctx.moveTo(px, pyBottom);
        ctx.lineTo(px, pyBottom + 4);
        ctx.stroke();
        ctx.fillText((xVal > 0 ? "+" : "") + xVal, px, pyBottom + 6);
      }

      // Top Y-Axis Labels (0.0, 0.5, 1.0)
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      [0, 0.5, 1.0].forEach(uVal => {
        const py = mapTopY(uVal);
        ctx.fillText(uVal.toFixed(1), margin.left - 6, py);
      });

      // Panel Labels / Titles
      ctx.fillStyle = colorOnSurface;
      ctx.font = "bold 11px var(--ff-sans)";
      ctx.textAlign = "left";
      ctx.fillText("CDF 累积分布 Φ(x)", margin.left + 8, margin.top + 12);
      ctx.fillText("PDF 概率密度与样本直方图 f(x)", margin.left + 8, margin.top + topHeight + gapHeight + 12);

      // 3. Empirical Histogram from Samples
      if (state.samples.length > 0) {
        const numBins = 28;
        const binWidthVal = (xMax - xMin) / numBins;
        const counts = new Array(numBins).fill(0);

        const visibleCount = Math.floor(state.samples.length * state.animProgress);
        for (let i = 0; i < visibleCount; i++) {
          const sx = state.samples[i].x;
          const binIdx = Math.floor((sx - xMin) / binWidthVal);
          if (binIdx >= 0 && binIdx < numBins) {
            counts[binIdx]++;
          }
        }

        const totalN = visibleCount || 1;
        const pxBinWidth = totalWidth / numBins;

        ctx.fillStyle = colorAccentContainer;
        ctx.strokeStyle = colorChart1;
        ctx.lineWidth = 1;

        for (let i = 0; i < numBins; i++) {
          const density = counts[i] / (totalN * binWidthVal);
          const pxLeft = margin.left + i * pxBinWidth;
          const pyTop = mapBottomY(density);
          const pyBase = mapBottomY(0);
          const hBin = pyBase - pyTop;

          if (hBin > 0) {
            ctx.fillRect(pxLeft, pyTop, pxBinWidth, hBin);
            ctx.strokeRect(pxLeft, pyTop, pxBinWidth, hBin);
          }
        }
      }

      // 4. Draw Theoretical CDF Path
      ctx.strokeStyle = colorChart1;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let px = 0; px <= totalWidth; px += 2) {
        const xVal = xMin + (px / totalWidth) * (xMax - xMin);
        const uVal = normCdf(xVal);
        const py = mapTopY(uVal);
        if (px === 0) ctx.moveTo(margin.left + px, py);
        else ctx.lineTo(margin.left + px, py);
      }
      ctx.stroke();

      // 5. Draw Theoretical PDF Bell Curve
      ctx.strokeStyle = colorChart3;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let px = 0; px <= totalWidth; px += 2) {
        const xVal = xMin + (px / totalWidth) * (xMax - xMin);
        const pdfVal = normPdf(xVal);
        const py = mapBottomY(pdfVal);
        if (px === 0) ctx.moveTo(margin.left + px, py);
        else ctx.lineTo(margin.left + px, py);
      }
      ctx.stroke();

      // 6. Draw Single Active Inspection Ray Path (u -> x -> PDF)
      const curU = state.u;
      const curX = normInv(curU);
      const curPdf = normPdf(curX);

      const ptY = mapTopY(curU);
      const ptX = mapX(curX);
      const pdfY = mapBottomY(curPdf);
      const baseY = mapBottomY(0);

      // Delta U band around inspection point
      const du = 0.05;
      const u1 = Math.max(0.01, curU - du);
      const u2 = Math.min(0.99, curU + du);
      const x1 = normInv(u1);
      const x2 = normInv(u2);

      const duY1 = mapTopY(u2);
      const duY2 = mapTopY(u1);
      const dxX1 = mapX(x1);
      const dxX2 = mapX(x2);

      // Highlighted delta u -> delta x interval box
      ctx.fillStyle = "rgba(222, 45, 41, 0.12)";
      ctx.fillRect(margin.left, duY1, ptX - margin.left, duY2 - duY1);
      ctx.fillRect(dxX1, duY1, dxX2 - dxX1, baseY - duY1);

      // Horizontal ray: Y-axis to CDF curve
      ctx.strokeStyle = getCssVar('--error') || '#de2d29';
      ctx.lineWidth = 1.8;
      ctx.setLineDash([4, 3]);

      ctx.beginPath();
      ctx.moveTo(margin.left, ptY);
      ctx.lineTo(ptX, ptY);
      ctx.stroke();

      // Vertical ray: CDF curve down to PDF curve & X-axis
      ctx.beginPath();
      ctx.moveTo(ptX, ptY);
      ctx.lineTo(ptX, baseY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Focal points / Knots
      // Point on Y-axis
      ctx.fillStyle = getCssVar('--error') || '#de2d29';
      ctx.beginPath();
      ctx.arc(margin.left, ptY, 4, 0, 2 * Math.PI);
      ctx.fill();

      // Knot on CDF curve
      ctx.fillStyle = colorPrimary;
      ctx.beginPath();
      ctx.arc(ptX, ptY, 5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Knot on PDF curve
      ctx.fillStyle = colorChart3;
      ctx.beginPath();
      ctx.arc(ptX, pdfY, 5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.stroke();

      // Request animation frame if animating
      if (state.animProgress < 1.0) {
        animationFrameId = requestAnimationFrame(renderCanvas);
      }
    }

    // Sync readout badges and data model
    function updateViz() {
      try {
        const u = state.u;
        const x = normInv(u);
        const fx = normPdf(x);
        const ratio = 1 / fx; // dx / du = 1 / f(x)

        document.getElementById('kpi-u').textContent = u.toFixed(4);
        document.getElementById('kpi-x').textContent = (x >= 0 ? "+" : "") + x.toFixed(4);
        document.getElementById('kpi-fx').textContent = fx.toFixed(4);
        document.getElementById('kpi-ratio').textContent = ratio.toFixed(4);

        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        renderCanvas();
      } catch (err) {
        showErrorFallback('viewport-zone', err);
      }
    }

    // Initialize controls and DOM event listeners
    function init() {
      canvas = document.getElementById('samplingCanvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
      }

      // Populate initial 200 samples
      generateSamples(200);

      // Slider listener
      const uSlider = document.getElementById('slider-u');
      if (uSlider) {
        uSlider.addEventListener('input', (e) => {
          state.u = parseFloat(e.target.value);
          const pct = (e.target.value - e.target.min) / (e.target.max - e.target.min) * 100;
          e.target.style.setProperty('--progress', pct + '%');
          const valBadge = document.getElementById('slider-u-val');
          if (valBadge) valBadge.textContent = state.u.toFixed(2);
          updateViz();
        });
      }

      // Sample button
      const sampleBtn = document.getElementById('btn-sample');
      if (sampleBtn) {
        sampleBtn.addEventListener('click', () => {
          generateSamples(200);
          updateViz();
        });
      }

      // Bands toggle button
      const bandsBtn = document.getElementById('btn-bands');
      if (bandsBtn) {
        bandsBtn.addEventListener('click', () => {
          state.showBands = !state.showBands;
          bandsBtn.classList.toggle('is-active', state.showBands);
          updateViz();
        });
      }

      // Resize listener
      window.addEventListener('resize', () => {
        updateViz();
      });

      // Initial visual render
      updateViz();
    }

    // Entry point execution
    init();

    // Host Theme Synchronization & Dynamic Height Auto-Resize
    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      if (typeof updateViz === 'function') updateViz();
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme);
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
